    <style>
      :root {
        --neon-cyan: #2dd4bf;
        --dark-bg: #050810;
      }
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      
      .glass-card {
        backdrop-filter: blur(16px);
        border: 1px solid rgba(45, 212, 191, 0.15);
      }
      
      .neon-border {
        box-shadow: 0 0 20px rgba(45, 212, 191, 0.3), inset 0 0 5px rgba(45, 212, 191, 0.2);
      }

      .neon-text {
        text-shadow: 0 0 15px rgba(45, 212, 191, 0.9);
      }

      /* Scrollbar Customizada */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2dd4bf; border-radius: 10px; }
      
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      /* Classes de Tema */
      .theme-dark {
        background-color: #050810;
        color: #f8fafc;
      }
      .theme-light {
        background-color: #f1f5f9;
        color: #0f172a;
      }
      
      /* Animação de Bounce Suave para o Banner de Instalação */
      @keyframes bounce-short {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .animate-bounce-short {
        animation: bounce-short 3s infinite ease-in-out;
      }
    </style>
