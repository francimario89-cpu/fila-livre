
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fila Livre - Performance & Estilo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --neon-cyan: #2dd4bf;
        --dark-bg: #050810;
      }
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      
      .glass-card {
        backdrop-filter: blur(16px);
        border: 1px solid rgba(45, 212, 191, 0.15);
      }
      
      .neon-border {
        box-shadow: 0 0 20px rgba(45, 212, 191, 0.3), inset 0 0 5px rgba(45, 212, 191, 0.2);
      }

      .neon-text {
        text-shadow: 0 0 15px rgba(45, 212, 191, 0.9);
      }

      /* Scrollbar Customizada */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2dd4bf; border-radius: 10px; }
      
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      /* Classes de Tema */
      .theme-dark {
        background-color: #050810;
        color: #f8fafc;
      }
      .theme-light {
        background-color: #f1f5f9;
        color: #0f172a;
      }
      .theme-light .glass-card {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.05);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }
      .theme-dark .glass-card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(45, 212, 191, 0.15);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "firebase/app": "https://esm.sh/firebase@10.8.0/app",
    "firebase/auth": "https://esm.sh/firebase@10.8.0/auth",
    "firebase/firestore": "https://esm.sh/firebase@10.8.0/firestore",
    "firebase/": "https://esm.sh/firebase@10.8.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="theme-dark">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
